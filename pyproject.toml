[project]
name = "agro-esg-carbon-compliance"
version = "0.1.0"
description = "AgroESG Project - Carbon Compliance & Risk Analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- Core Engine (O "Motor" do ELT) ---
    "apache-airflow[google,postgres]==2.10.0",
    "psycopg2-binary>=2.9.0",
    "duckdb>=1.0.0",
    "pyarrow>=14.0.0",
    # --- Cloud & Storage (A "Infra") ---
    "google-cloud-storage",
    "google-cloud-bigquery",
    # --- Transformation (A "Inteligência") ---
    "dbt-bigquery>=1.7.0",
    "astronomer-cosmos[google]>=1.2.0",
    # --- Utils Essenciais ---
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "snowplow-tracker<1.0.0",
    "streamlit>=1.54.0",
    "plotly>=6.5.2",
    "folium>=0.20.0",
    "streamlit-folium>=0.26.1",
    "db-dtypes>=1.5.0",
    "pydeck>=0.9.1",
    "earthengine-api>=0.1.300",
    "geemap>=0.30.0",
    "fastapi>=0.131.0",
    "uvicorn>=0.41.0",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.22",
    "pydantic-settings>=2.13.1",
    "shapely>=2.0.0",
    "requests>=2.31.0",
    "apache-airflow-providers-google>=10.0.0",
    "dbterd>=1.23.0",
    "geopandas>=1.1.2",
    "passlib[bcrypt]>=1.7.4",
    "supabase>=2.28.2",
    "routers>=0.1.2",
    "mercadopago>=2.3.0",
    "pdfkit>=1.0.0",
    "contextily>=1.7.0",
    "xlrd>=2.0.2",
    "pystac-client>=0.9.0",
    "planetary-computer>=1.0.0",
    "stackstac>=0.5.1",
    "xarray[complete]>=2026.2.0",
    "dask[complete]>=2026.3.0",
    "rioxarray>=0.19.0",
    "flox>=0.11.2",
    "gcsfs>=2025.2.0",
    "adlfs>=2026.2.0",
    "feedparser>=6.0.12",
    "weasyprint>=68.1",
    "fpdf2>=2.8.7",
    "pillow>=12.1.1",
    "pdfplumber>=0.11.9",
]

[tool.uv]
managed = true

# Grupo de desenvolvimento
[dependency-groups]
dev = [
    "jupyterlab>=4.0.0",
    "black",
    "ruff",
]
