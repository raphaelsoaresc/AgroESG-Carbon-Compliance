steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/caipora-sentinela-frontend',
      '--build-arg', 'NEXT_PUBLIC_API_URL=${_API_URL}',
      '--build-arg', 'NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}',
      '--build-arg', 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_KEY}',
      '.'
    ]
images:
  - 'gcr.io/$PROJECT_ID/caipora-sentinela-frontend'