name: 'agro_credit_transform'
version: '1.2.0'
config-version: 2

profile: 'agro_credit_transform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------
# 1. VARIÁVEIS GLOBAIS (Onde a mágica acontece)
# ---------------------------------------------------------------
vars:
  # --- Configurações de Compliance e Limites ---
  # Data do Marco Temporal (Código Florestal): Alertas antes desta data são ignorados.
  forest_code_threshold_date: '2008-07-22'
  
  # Limite de tolerância para ruído de GPS/GIS (em hectares e %)
  # AJUSTE EUDR: Reduzido de 0.1 para 0.01 para evitar omissão de desmatamento pós-2020.
  gis_noise_ha_threshold: 0.01
  gis_noise_pct_threshold: 0.005

  # --- Multiplicadores de Risco Financeiro (Brecha 3) ---
  # Valores usados para calcular o passivo ambiental estimado
  fine_deforestation_per_ha: 5000
  fine_protected_area_per_ha: 10000
  fine_slave_labor_fixed: 500000
  fine_app_violation_fixed: 50000
  fine_rl_deficit_per_ha: 5000

# ---------------------------------------------------------------
# 2. CONFIGURAÇÃO DOS MODELOS
# ---------------------------------------------------------------
models:
  agro_credit_transform:
    +materialized: view
    
    staging:
      +schema: agro_esg_staging
      +materialized: view
      +tags: ["bronze", "staging"]

    intermediate:
      +schema: agro_esg_intermediate
      +materialized: table 
      +tags: ["silver", "intermediate"]

    marts:
      +schema: agro_esg_marts
      +materialized: table
      +tags: ["gold", "marts", "bi"]