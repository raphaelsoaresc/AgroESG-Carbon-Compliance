version: 2

models:
  - name: fct_compliance_risk
    description: "Mart final de conformidade socioambiental (CAR) integrando riscos Ambientais, Sociais e monitoramento de Relevo (Ground Truth)."
    
    # 1. TESTES DE NÍVEL DE MODELO (Integridade das Regras de Negócio)
    data_tests:
      # Validação de Elegibilidade vs Embargos (Respeitando a regra de 2008 e data de sistema 1900)
      - dbt_utils.expression_is_true:
          expression: "NOT (final_eligibility_status LIKE 'ELIGIBLE%' AND embargo_area_ha > 0.1 AND (embargo_date >= '2008-07-22' OR embargo_date = '1900-01-01'))"
          name: "check_eligible_properties_environmental_limit"
      
      - dbt_utils.expression_is_true:
          expression: "NOT (final_eligibility_status LIKE 'ELIGIBLE%' AND (internal_risks_found LIKE '%SOCIAL%' OR internal_risks_found LIKE '%SLAVE%'))"
          name: "check_eligible_properties_social_limit"

      # Validação de Elegibilidade vs MapBiomas (Respeitando a regra de 2008)
      - dbt_utils.expression_is_true:
          expression: "NOT (final_eligibility_status LIKE 'ELIGIBLE%' AND mapbiomas_deforested_ha > 0.1 AND (mapbiomas_detection_date >= '2008-07-22' OR mapbiomas_detection_date IS NULL))"
          name: "check_eligible_properties_mapbiomas_limit"

      # Testes de Limite Físico (Garantindo que sobreposições não superem a área total)
      - dbt_utils.expression_is_true:
          expression: "protected_area_overlap_ha <= (area_ha + 0.01)"
          name: "check_physical_limit_protected_area_overlap"
          
      - dbt_utils.expression_is_true:
          expression: "mapbiomas_deforested_ha <= (area_ha + 0.01)"
          name: "check_physical_limit_mapbiomas_overlap"

      # Bloqueio Hard para Áreas Protegidas Restritas (TI, UC, Quilombo)
      # AJUSTE: Agora permite qualquer status de MANUAL_REVIEW_REQUIRED. 
      # Se o dado está inconsistente ou pendente, a revisão manual é a conduta de segurança correta.
      - dbt_utils.expression_is_true:
          expression: "NOT ((forensic_ti_ha > 0.01 OR forensic_uc_ha > 0.01 OR forensic_quilombo_ha > 0.01) AND final_eligibility_status NOT LIKE 'NOT ELIGIBLE%' AND final_eligibility_status NOT LIKE 'ELIGIBLE - % PRODUCER' AND final_eligibility_status NOT LIKE 'MANUAL_REVIEW_REQUIRED%')"
          name: "check_protected_area_hard_block_priority"

      - dbt_utils.expression_is_true:
          expression: "NOT (rl_status = 'EXEMPT' AND rl_deficit_ha > 0)"
          name: "check_legal_reserve_coherence"

      - dbt_utils.expression_is_true:
          expression: "NOT (eudr_deforested_ha > 0 AND mapbiomas_detection_date <= '2020-12-31')"
          name: "check_eudr_date_coherence"

      - dbt_utils.expression_is_true:
          expression: "embargo_date <= CURRENT_DATE() OR embargo_date IS NULL OR embargo_date = '1900-01-01'"
          name: "check_no_future_embargo_dates"

      - dbt_utils.expression_is_true:
          expression: "NOT (final_eligibility_status = 'NOT ELIGIBLE - SOCIAL RISK (SLAVE LABOR)' AND (internal_risks_found NOT LIKE '%SOCIAL%' AND internal_risks_found NOT LIKE '%SLAVE%'))"
          name: "check_social_block_has_evidence"

      - dbt_utils.expression_is_true:
          expression: "NOT (final_eligibility_status = 'WARNING - RISK BY ADJACENCY' AND (adjacency_details IS NULL OR adjacency_details = ''))"
          name: "check_adjacency_warning_has_details"

      # Testes de Integridade Financeira
      - dbt_utils.expression_is_true:
          expression: "estimated_financial_liability_brl >= 0"
          name: "check_liability_is_not_negative"

      - dbt_utils.expression_is_true:
          expression: "ABS(estimated_financial_liability_brl - (liability_deforestation_brl + liability_rl_brl + liability_protected_areas_brl + liability_social_brl + liability_app_brl + liability_embargo_brl)) < 0.01"
          name: "check_liability_math_sum"

      # Testes Geográficos e de Fraude
      - dbt_utils.expression_is_true:
          expression: "latitude BETWEEN -34.0 AND 6.0 AND longitude BETWEEN -74.0 AND -34.0"
          name: "check_coordinates_inside_brazil"

      - dbt_utils.expression_is_true:
          expression: "COALESCE(area_ha, 0) >= 0 AND COALESCE(area_ha, 0) < 2000000"
          name: "check_area_realistic_limit"
          config:
            severity: warn

      - dbt_utils.expression_is_true:
          expression: "(ST_AREA(geometry) / 10000) <= (area_ha * 1.50)"
          name: "check_declared_vs_drawn_area_fraud"
          config:
            severity: warn

      - dbt_utils.expression_is_true:
          expression: "ST_AREA(geometry) > 0"
          name: "check_geometry_is_not_empty"

    columns:
      - name: final_eligibility_status
        data_tests:
          - not_null
          - accepted_values:
              values:
                # 1. ELEGÍVEL (PURO E IDENTIDADES)
                  - "ELIGIBLE"
                  - "ELIGIBLE - INDIGENOUS PRODUCER"
                  - "ELIGIBLE - CONSERVATION UNIT PRODUCER"
                  - "ELIGIBLE - SETTLEMENT PRODUCER"
                  - "ELIGIBLE - TRADITIONAL PRODUCER"
                  - "ELIGIBLE - QUILOMBOLA PRODUCER"
                  - "ELIGIBLE - MITIGATED ADJACENCY RISK (PHYSICAL BARRIER)"

                  # 2. AVISOS E CONDICIONANTES (WARNING)
                  - "WARNING - CRITICAL ADJACENCY RISK (LAUNDERING)"
                  - "WARNING - RISK BY ADJACENCY"
                  - "WARNING - CRITICAL ADJACENCY RISK"
                  - "WARNING - EMBARGO CANCELLED/JUDICIAL"
                  - "WARNING - OLD EMBARGO"
                  - "WARNING - OLD EMBARGO (PRE-2008)"
                  - "WARNING - HIGH CAR OVERLAP"
                  - "WARNING - BORDERLINE SLOPE"
                  - "CONDITIONAL - RL REGULARIZATION"

                  # 3. REVISÃO MANUAL (INCONSISTÊNCIAS DE AUDITORIA)
                  - "MANUAL_REVIEW - INCONSISTENT AREA"
                  - "MANUAL_REVIEW_REQUIRED - POTENTIAL AREA FRAUD"
                  - "MANUAL_REVIEW_REQUIRED - PENDING STATE ANALYSIS"
                  - "MANUAL_REVIEW_REQUIRED - ARTIFICIAL WATER BODY DETECTED"
                  - "MANUAL_REVIEW_REQUIRED - INCONSISTENT CAR STATUS"
                  - "MANUAL_REVIEW_REQUIRED - MISSING STATUS DATA"
                  - "MANUAL_REVIEW_REQUIRED - DATA SOURCE CONFLICT"
                  - "MANUAL_REVIEW_REQUIRED - OUT OF SCOPE"
                  - "MANUAL_REVIEW_REQUIRED - UNUSUAL AREA FOR IDENTITY"
                  - "MANUAL_REVIEW_REQUIRED - UNREALISTIC AREA"
                  - "AWAITING_MANUAL_VALIDATION - POTENTIAL SOCIAL RISK"

                  # 4. NÃO ELEGÍVEL (CRIMES E INFRAÇÕES DE SOLO)
                  - "NOT ELIGIBLE - SOCIAL RISK (SLAVE LABOR)"
                  - "NOT ELIGIBLE - AMZ EMBARGO (CMN 5.081)"
                  - "NOT ELIGIBLE - EMBARGO"
                  - "NOT ELIGIBLE - EMBARGO (OFFICIAL SOURCE)"
                  - "NOT ELIGIBLE - DEFORESTATION (MAPBIOMAS)"
                  - "NOT ELIGIBLE - DEFORESTATION (MISSING DATE EVIDENCE)"
                  - "NOT ELIGIBLE - EUDR VIOLATION (POST-2020)"
                  - "NOT ELIGIBLE - APP DEFORESTATION"
                  - "NOT ELIGIBLE - STRUCTURED ENVIRONMENTAL RISK"
                  - "NOT ELIGIBLE - INFRASTRUCTURE IN DEFORESTED AREA"

                  # 5. NÃO ELEGÍVEL (INVASÕES E DOCUMENTAÇÃO)
                  - "NOT ELIGIBLE - INDIGENOUS LAND"
                  - "NOT ELIGIBLE - QUILOMBOLA (INVASION)"
                  - "NOT ELIGIBLE - CONSERVATION UNIT"
                  - "NOT ELIGIBLE - SETTLEMENT (INVASION)"
                  - "NOT ELIGIBLE - TRADITIONAL TERRITORY (INVASION)"
                  - "NOT ELIGIBLE - CAR STATUS"
                  - "NOT ELIGIBLE - INVALID GEOMETRY"
                  - "NOT ELIGIBLE - RL DEFICIT"
                  - "NOT ELIGIBLE - SATELLITE (SLOPE)"

  - name: fct_compliance_geometries_mart
    description: "Backend espacial otimizado para o mapa do frontend. Contém bordas de propriedades e camadas de restrição (Long Format)."
    columns:
      - name: property_id
        data_tests:
          - not_null

      - name: map_layer
        description: "Identificador do grupo de camadas para o controle de camadas (Layer Control) no Leaflet."
        data_tests:
          - not_null
          - accepted_values:
              values:
                - 'BASE'      # Limite da propriedade
                - 'CRIMINAL'  # Desmatamentos, Embargos, EUDR, APP
                - 'LOGISTICS' # Estradas e Linhas de Transmissão

      - name: geometry
        description: "Geometria simplificada para renderização web."
        data_tests:
          - not_null

      - name: xmin
        data_tests:
          - not_null
      - name: ymin
        data_tests:
          - not_null
      - name: xmax
        data_tests:
          - not_null
      - name: ymax
        data_tests:
          - not_null

      - name: final_eligibility_status
        data_tests:
          - not_null

  - name: fct_social_impact_slave_labor
    description: "Dossiê de inteligência para resgate e fiscalização de Trabalho Escravo. Foca em isolamento geográfico e vetores de fuga."
    data_tests:
      # Teste atualizado para os novos nomes de coluna
      - dbt_utils.expression_is_true:
          expression: "NOT (risk_level LIKE 'CRÍTICO%' AND inteligencia_aerea NOT LIKE '%PISTA%')"
          name: "check_slave_labor_airstrip_evidence"
      
      - dbt_utils.expression_is_true:
          expression: "casos_trabalho_escravo_no_mesmo_grid >= 1"
          name: "check_slave_labor_grid_density_positive"

    columns:
      - name: property_id
        data_tests:
          - unique
          - not_null
      - name: infrator_identificado
        data_tests:
          - not_null
      - name: risk_level
        description: "Nível de risco operacional baseado em logística de fuga e isolamento."
        data_tests:
          - accepted_values:
              values: [
                'CRÍTICO: Cárcere com Pista Clandestina',
                'CRÍTICO: Vetor de Fuga Aéreo Interno', 
                'CRÍTICO: Isolamento Geográfico (Acesso apenas por Rio)', 
                'ALTO: Isolamento Geográfico Total', 
                'PADRÃO'
              ]
      - name: inteligencia_aerea
        data_tests:
          - not_null
      - name: inteligencia_rodoviaria
        data_tests:
          - not_null

  - name: fct_territorial_invasion_forensics
    description: "Análise forense de invasões em áreas protegidas com identificação de nexo causal logístico."
    data_tests:
      # Teste de Limite Físico: Área de invasão não pode ser maior que a área total do imóvel
      - dbt_utils.expression_is_true:
          expression: "area_invasao_ha <= (area_total_imovel_ha + 0.01)"
          name: "check_invasion_physical_limit"
      
      # Se houver nexo causal logístico, a severidade deve refletir isso em casos críticos
      - dbt_utils.expression_is_true:
          expression: "NOT (nexo_causal_logistico IS TRUE AND area_invasao_ha > 1000 AND severidade_forense NOT LIKE '%Estruturada%')"
          name: "check_invasion_structural_nexus_severity"

    columns:
      - name: recibo_car_real
        data_tests:
          - not_null
      - name: severidade_forense
        description: "Classificação da gravidade da invasão baseada em área, status do CAR e logística."
        data_tests:
          - accepted_values:
              values: [
                'CRÍTICO: Mega-Invasão Estruturada (Nexo Logístico)', 
                'CRÍTICO: Mega-Invasão Ativa', 
                'CRÍTICO: CAR de Prateleira (Sobreposição Total)', 
                'ALTO: Invasão com Apoio Aéreo', 
                'ALTO: Mega-Invasão (Status Irregular)', 
                'ALTO: Invasão Parcial'
              ]
      - name: nexo_causal_logistico
        description: "Flag booleana indicando se a infraestrutura serve diretamente à área invadida."
        data_tests:
          - not_null
      - name: area_invasao_ha
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "> 0.5" # Filtro de ruído definido no SQL

  - name: fct_property_investment_intelligence
    description: "Mart de inteligência de ativos e rating de investimento."
    columns:
      - name: property_id
        tests:
          - unique
          - not_null

      - name: investment_score
        description: "Score final ponderado pelo multiplicador de liquidez."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100

      - name: land_use_efficiency_pct
        description: "Percentual de área consolidada em relação à área total."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100

      - name: investment_rating
        tests:
          - accepted_values:
              values: [
                'AAA - Premium Asset',
                'AA - High Productivity',
                'A - Operational',
                'B - Turnaround Opportunity',
                'C - High Risk / Distressed',
                'D - Low Potential'
              ]

      - name: estimated_regularization_cost_brl
        tests:
          - dbt_utils.expression_is_true:
              expression: ">= 0"