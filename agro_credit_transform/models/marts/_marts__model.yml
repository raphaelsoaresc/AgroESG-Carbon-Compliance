version: 2

models:
  - name: fct_compliance_risk
    description: "Mart final de conformidade socioambiental (CAR) integrando riscos Ambientais, Sociais e monitoramento de Relevo (Ground Truth)."
    
    # 1. TESTES DE NÍVEL DE MODELO (Integridade das Regras de Negócio)
    data_tests:
      # Validação de Elegibilidade vs Embargos (Respeitando a regra de 2008 e data de sistema 1900)
      - dbt_utils.expression_is_true:
          expression: "NOT (final_eligibility_status = 'ELIGIBLE' AND embargo_area_ha > 0.1 AND (embargo_date >= '2008-07-22' OR embargo_date = '1900-01-01'))"
          name: "check_eligible_properties_environmental_limit"
      
      - dbt_utils.expression_is_true:
          expression: "NOT (final_eligibility_status = 'ELIGIBLE' AND (internal_risks_found LIKE '%SOCIAL%' OR internal_risks_found LIKE '%SLAVE%'))"
          name: "check_eligible_properties_social_limit"

      - dbt_utils.expression_is_true:
          expression: "NOT (final_eligibility_status = 'ELIGIBLE' AND max_slope_degrees > 45)"
          name: "check_eligible_properties_satellite_limit"

      # Validação de Elegibilidade vs MapBiomas (Respeitando a regra de 2008)
      - dbt_utils.expression_is_true:
          expression: "NOT (final_eligibility_status = 'ELIGIBLE' AND mapbiomas_deforested_ha > 0.1 AND (mapbiomas_detection_date >= '2008-07-22' OR mapbiomas_detection_date IS NULL))"
          name: "check_eligible_properties_mapbiomas_limit"

      # Testes de Limite Físico (Garantindo que sobreposições não superem a área total)
      - dbt_utils.expression_is_true:
          expression: "protected_area_overlap_ha <= (area_ha + 0.01)"
          name: "check_physical_limit_protected_area_overlap"
          
      - dbt_utils.expression_is_true:
          expression: "mapbiomas_deforested_ha <= (area_ha + 0.01)"
          name: "check_physical_limit_mapbiomas_overlap"

      # Bloqueio Hard para Áreas Protegidas (Tolerância zero para passar no assert_protected_area_causes_hard_block)
      - dbt_utils.expression_is_true:
          expression: "NOT (protected_area_overlap_ha > 0.001 AND final_eligibility_status NOT LIKE 'NOT ELIGIBLE%')"
          name: "check_protected_area_hard_block_priority"

      - dbt_utils.expression_is_true:
          expression: "NOT (rl_status = 'EXEMPT' AND rl_deficit_ha > 0)"
          name: "check_legal_reserve_coherence"

      - dbt_utils.expression_is_true:
          expression: "NOT (eudr_deforested_ha > 0 AND mapbiomas_detection_date <= '2020-12-31')"
          name: "check_eudr_date_coherence"

      - dbt_utils.expression_is_true:
          expression: "embargo_date <= CURRENT_DATE() OR embargo_date IS NULL OR embargo_date = '1900-01-01'"
          name: "check_no_future_embargo_dates"

      - dbt_utils.expression_is_true:
          expression: "NOT (final_eligibility_status = 'NOT ELIGIBLE - SOCIAL RISK (SLAVE LABOR)' AND (internal_risks_found NOT LIKE '%SOCIAL%' AND internal_risks_found NOT LIKE '%SLAVE%'))"
          name: "check_social_block_has_evidence"

      - dbt_utils.expression_is_true:
          expression: "NOT (final_eligibility_status = 'WARNING - RISK BY ADJACENCY' AND (adjacency_details IS NULL OR adjacency_details = ''))"
          name: "check_adjacency_warning_has_details"

      # Testes de Integridade Financeira
      - dbt_utils.expression_is_true:
          expression: "estimated_financial_liability_brl >= 0"
          name: "check_liability_is_not_negative"

      - dbt_utils.expression_is_true:
          expression: "ABS(estimated_financial_liability_brl - (liability_deforestation_brl + liability_rl_brl + liability_protected_areas_brl + liability_social_brl + liability_app_brl)) < 0.01"
          name: "check_liability_math_sum"

      # Testes Geográficos e de Fraude
      - dbt_utils.expression_is_true:
          expression: "latitude BETWEEN -34.0 AND 6.0 AND longitude BETWEEN -74.0 AND -34.0"
          name: "check_coordinates_inside_brazil"

      - dbt_utils.expression_is_true:
          expression: "area_ha > 0 AND area_ha < 2000000"
          name: "check_area_realistic_limit"

      - dbt_utils.expression_is_true:
          expression: "(ST_AREA(geometry) / 10000) <= (area_ha * 1.50)"
          name: "check_declared_vs_drawn_area_fraud"
          config:
            severity: warn

      - dbt_utils.expression_is_true:
          expression: "ST_AREA(geometry) > 0"
          name: "check_geometry_is_not_empty"

    columns:
      - name: final_eligibility_status
        data_tests:
          - accepted_values:
              values:
                - "ELIGIBLE"
                - "WARNING - RISK BY ADJACENCY"
                - "WARNING - EMBARGO CANCELLED/JUDICIAL"
                - "WARNING - OLD EMBARGO"
                - "WARNING - OLD EMBARGO (PRE-2008)"
                - "WARNING - HIGH CAR OVERLAP"
                - "WARNING - BORDERLINE SLOPE"
                - "CONDITIONAL - RL DEFICIT"
                - "MANUAL_REVIEW_REQUIRED - OUT OF SCOPE"
                - "AWAITING_MANUAL_VALIDATION - POTENTIAL SOCIAL RISK"
                - "NOT ELIGIBLE - SOCIAL RISK (SLAVE LABOR)"
                - "NOT ELIGIBLE - CAR STATUS"
                - "NOT ELIGIBLE - DEFORESTATION (MAPBIOMAS)"
                - "NOT ELIGIBLE - SATELLITE (SLOPE)"
                - "NOT ELIGIBLE - INVALID GEOMETRY"
                - "NOT ELIGIBLE - EUDR VIOLATION (POST-2020)"
                - "NOT ELIGIBLE - INDIGENOUS LAND"
                - "NOT ELIGIBLE - QUILOMBOLA"
                - "NOT ELIGIBLE - CONSERVATION UNIT"
                - "NOT ELIGIBLE - SETTLEMENT"
                - "NOT ELIGIBLE - TRADITIONAL TERRITORY"
                - "NOT ELIGIBLE - EMBARGO"
                - "NOT ELIGIBLE - IBAMA"
                - "NOT ELIGIBLE - IBAMA AMAZON (CMN 5.081)"
                - "NOT ELIGIBLE - SEMA_MT"
                - "NOT ELIGIBLE - SIGA_MT"
                - "NOT ELIGIBLE - ICMBIO"
                - "NOT ELIGIBLE - APP DEFORESTATION (WATER)"
                - "NOT ELIGIBLE - APP DEFORESTATION (SLOPE)"
                - "NOT ELIGIBLE - APP DEFORESTATION"

      - name: max_slope_degrees
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 90