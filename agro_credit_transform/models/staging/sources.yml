version: 2

sources:
  - name: raw_data
    description: "Landing Zone: Dados brutos de fontes externas (SIGEF, IBAMA, CAR, MTE, GEE, MapBiomas, SEMA-MT, INCRA, ICMBio) populados via Airflow/DuckDB."
    dataset: agro_esg_raw

    tables:
      # --- INFRAESTRUTURA E TOPOGRAFIA (GEE) ---
      - name: raw_ee_topography
        description: "Dados brutos de elevação e declividade extraídos do Google Earth Engine."
        columns:
          - name: property_id
            description: "ID único da propriedade (vinculado ao CAR/SIGEF)."
          - name: max_slope
            description: "Declividade máxima encontrada no polígono."

      - name: raw_ee_consolidated
        description: "Métricas consolidadas de satélite processadas via GEE."

      # --- REGULARIDADE FUNDIÁRIA E AMBIENTAL (SIGEF) ---
      - name: sigef_history_mt
        description: "Histórico de certificações de imóveis rurais no SIGEF - Mato Grosso."
        columns: &hash_control
          - name: file_hash
            description: "Hash MD5 do arquivo original para controle de idempotência."

      - name: sigef_history_am
        description: "Histórico de certificações de imóveis rurais no SIGEF - Amazonas."
        columns: *hash_control

      - name: sigef_history_ro
        description: "Histórico de certificações de imóveis rurais no SIGEF - Rondônia."
        columns: *hash_control

      - name: sigef_history_pa
        description: "Histórico de certificações de imóveis rurais no SIGEF - Pará."
        columns: *hash_control

      - name: sigef_history
        description: "Base histórica consolidada de certificações SIGEF."

      # --- TABELAS DO CAR (GEOMETRIAS E TEMAS) ---
      - name: car_area_imovel_geometria_mt
        description: "Geometria espacial (WKT) das propriedades rurais do CAR - Mato Grosso."
        columns: &car_geom_columns
          - <<: *hash_control
          - name: wkt_geom
            description: "Geometria em formato WKT (EPSG:4326)."
          - name: uf_origem
            description: "Sigla do estado injetada durante a ingestão via DuckDB."

      - name: car_area_imovel_geometria_pa
        description: "Geometria espacial (WKT) das propriedades rurais do CAR - Pará."
        columns: *car_geom_columns

      - name: car_area_imovel_geometria_am
        description: "Geometria espacial (WKT) das propriedades rurais do CAR - Amazonas."
        columns: *car_geom_columns

      - name: car_area_imovel_geometria_ro
        description: "Geometria espacial (WKT) das propriedades rurais do CAR - Rondônia."
        columns: *car_geom_columns

      - name: car_metadados_proprietarios
        description: "Metadados de detentores e datas de registro do CAR."

      - name: car_temas_ambientais
        description: "Vetores de APP, Reserva Legal e Uso Consolidado (CSV/Parquet)."

      - name: car_sobreposicao
        description: "Cálculos de sobreposição nativos do SICAR com TIs e UCs."

      # --- COMPLIANCE: EMBARGOS E LISTA SUJA (COM FRESHNESS) ---
      - name: ibama_history
        description: "Histórico de áreas embargadas pelo IBAMA."
        freshness: &compliance_freshness
          warn_after: {count: 3, period: day}
          error_after: {count: 7, period: day}
        loaded_at_field: ingested_at
        columns: *hash_control

      - name: sema_mt_embargos
        description: "Base histórica de áreas embargadas pela SEMA-MT (Polígonos)."
        freshness: *compliance_freshness
        loaded_at_field: ingested_at
        columns: *hash_control

      - name: siga_mt_embargos
        description: "Novos embargos registrados no sistema SIGA da SEMA-MT (Polígonos)."
        freshness: *compliance_freshness
        loaded_at_field: ingested_at
        columns: *hash_control

      - name: icmbio_embargos
        description: "Áreas embargadas em Unidades de Conservação Federais pelo ICMBio."
        freshness: *compliance_freshness
        loaded_at_field: ingested_at
        columns: *hash_control

      - name: mte_slave_labor_history
        description: "Lista Suja do MTE - Trabalho análogo à escravidão."
        freshness:
          warn_after: {count: 90, period: day}
          error_after: {count: 180, period: day}
        loaded_at_field: ingested_at
        columns:
          - <<: *hash_control
          - name: cnpjcpf
            description: "CPF/CNPJ do infrator para cruzamento de malha."

      # --- MONITORAMENTO DE DESMATAMENTO (MAPBIOMAS) ---
      - name: mapbiomas_alertas_shapes
        description: "Polígonos de alertas validados. Fonte da verdade para geometria e data do desmatamento."
        columns:
          - <<: *hash_control
          - name: geometry_wkt
            description: "Geometria do alerta convertida de Shapefile para WKT via DuckDB."
          - name: alertid
            description: "ID único do alerta (Chave Primária)."
            tests:
              - not_null

      - name: mapbiomas_alertas_car_sigef
        description: "Tabela de ligação (Bridge) entre Alertas e Imóveis (CAR/SIGEF)."
        columns:
          - <<: *hash_control
          - name: codsicar
            description: "Código do imóvel no CAR."
          - name: alertid
            description: "ID do alerta correspondente."

      # --- TERRITÓRIOS PROTEGIDOS E REFERÊNCIA (ESTÁTICOS) ---
      - name: incra_municipal_indices
        description: "Índices básicos do INCRA por município (Módulo Fiscal e Fração Mínima de Parcelamento)."
        columns:
          - name: municipio_id
            description: "Código IBGE de 7 dígitos do município."
          - name: modulo_fiscal_ha
            description: "Valor de 1 Módulo Fiscal em hectares para o município."
          - name: fmp_ha
            description: "Fração Mínima de Parcelamento (FMP) em hectares."

      - name: ibge_biomes
        description: "Malha digital de biomas brasileiros (Escala 1:250.000)."
        columns:
          - <<: *hash_control
          - name: wkt_geometry
            description: "Geometria convertida para EPSG:4326."

      - name: funai_terras_indigenas  
        description: "Polígonos de Terras Indígenas (FUNAI) em todas as fases."
        columns: *hash_control

      - name: incra_quilombolas
        description: "Territórios Quilombolas delimitados pelo INCRA."
        columns: *hash_control

      - name: incra_assentamentos
        description: "Polígonos de Assentamentos de Reforma Agrária Federais (INCRA)."
        columns: *hash_control

      - name: intermat_assentamentos
        description: "Polígonos de Assentamentos de Reforma Agrária Estaduais (INTERMAT-MT)."
        columns: *hash_control

      - name: icmbio_unidades_conservacao
        description: "Limites oficiais das Unidades de Conservação Federais (ICMBio)."
        columns: *hash_control

      - name: sema_unidades_conservacao
        description: "Limites oficiais das Unidades de Conservação Estaduais (SEMA-MT)."
        columns: *hash_control

      # --- HIDROGRAFIA ---
      - name: ana_app_zones
        description: "Zonas de APP geradas via DuckDB (BHO Nível 07 - Strahler)."
        columns:
          - name: wkt_geom_app
            description: "Polígono da APP (EPSG:4326)."

      - name: ibge_bc250_app_zones
        description: "Zonas de APP de massas d'água (lagos/represas) da BC250."

      # --- INFRAESTRUTURA, HIDROGRAFIA E VETORES DE RISCO ---
      - name: ana_rios_app
        description: "Zonas de APP ao longo de rios (ANA). Baseado na Ordem de Strahler com buffers de 30m, 50m e 100m."
        loaded_at_field: ingested_at
        columns:
          - name: id_origem
            description: "Coluna COBACIA do arquivo original da ANA."
          - name: wkt_geom_app
            description: "Polígono da APP simplificado (EPSG:4326)."
          - <<: *hash_control

      - name: ibge_rodovias_risco
        description: "Faixas de domínio e risco de desmatamento em rodovias (IBGE BC250). Buffers de 40m (Federais/Estaduais) e 20m (Outras)."
        loaded_at_field: ingested_at
        columns:
          - name: id_origem
            description: "ID sequencial gerado na ingestão."
          - name: wkt_geom_app
            description: "Polígono da área de influência da rodovia (EPSG:4326)."
          - <<: *hash_control

      - name: ibge_massas_agua_app
        description: "Zonas de proteção (APP) ao redor de massas d'água, lagos e represas (IBGE BC250). Buffer fixo de 30m."
        loaded_at_field: ingested_at
        columns:
          - name: id_origem
            description: "ID sequencial gerado na ingestão."
          - name: wkt_geom_app
            description: "Polígono da zona de proteção da massa d'água (EPSG:4326)."
          - <<: *hash_control

      - name: cadastro_trabalho_escravo
        description: "Cadastro de Empregadores que tenham submetido trabalhadores a condições análogas à escravidão (Lista Suja atualizada)."
        freshness: *compliance_freshness
        loaded_at_field: ingested_at
        columns:
          - <<: *hash_control
          - name: id
            description: "ID sequencial do registro extraído do PDF."
          - name: ano_da_acao_fiscal
            description: "Ano em que a ação de fiscalização foi realizada."
          - name: uf
            description: "Unidade Federativa onde ocorreu a infração."
          - name: empregador
            description: "Nome do empregador ou Razão Social da empresa."
          - name: cnpjcpf
            description: "CNPJ ou CPF do empregador infrator."
          - name: estabelecimento
            description: "Localização ou nome do estabelecimento fiscalizado."
          - name: trabalhadores_envolvidos
            description: "Número de trabalhadores submetidos a condições análogas à escravidão."
          - name: cnae
            description: "Código Nacional de Atividade Econômica."
          - name: decisao_administrativa_de_procedencia
            description: "Data da decisão administrativa de procedência."
          - name: inclusao_no_cadastro_de_empregadores
            description: "Data de inclusão do empregador no cadastro."
          - name: source_filename
            description: "Nome do arquivo PDF de origem."
          - name: ingested_at
            description: "Timestamp da ingestão dos dados no BigQuery."

            
      - name: ibge_bc250_rodovias
        description: "Malha rodoviária completa da BC250 com nomes e siglas."
        columns:
          - name: sigla
            description: "Identificação da rodovia (ex: BR-163)."
          - name: operacional
            description: "Indica se a via existe ou é apenas projeto."
          - <<: *hash_control

      - name: ibge_bc250_pistas_pouso_l
        description: "Geometrias de linhas de pistas de pouso e decolagem."
        columns:
          - name: homologacao
            description: "Status de homologação da pista."
          - name: usopista
            description: "Tipo de uso (Privado, Público, Militar)."
          - <<: *hash_control

      - name: ibge_bc250_pistas_pouso_p
        description: "Pontos de localização de pistas de pouso."
        columns: *hash_control

      - name: ibge_bc250_linhas_energia
        description: "Trechos de linhas de transmissão de energia elétrica."
        columns:
          - name: largurafaixaservidao
            description: "Largura da faixa de servidão do linhão."
          - <<: *hash_control

      - name: ibge_bc250_massas_agua
        description: "Polígonos de massas d'água (Lagos, Represas, Baías)."
        columns:
          - name: artificial
            description: "Indica se a massa d'água é uma represa/reservatório."
          - <<: *hash_control

      - name: ibge_bc250_rios_linhas
        description: "Trechos de drenagem (Rios) com nomes e navegabilidade."
        columns:
          - name: nome
            description: "Nome oficial do curso d'água."
          - name: navegavel
            description: "Indica se o trecho permite navegação."
          - <<: *hash_control