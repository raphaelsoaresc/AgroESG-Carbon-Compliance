version: 2

sources:
  - name: raw_data
    description: "Landing Zone: Dados brutos de fontes externas (SIGEF, IBAMA, CAR, MTE, GEE, MapBiomas) populados via Airflow/DuckDB."
    # project: "{{ env_var('GCP_PROJECT_ID') }}" # Removido comentário para manter estrutura original
    dataset: agro_esg_raw

    tables:
      # --- INFRAESTRUTURA E TOPOGRAFIA (GEE) ---
      - name: raw_ee_topography
        description: "Dados brutos de elevação e declividade extraídos do Google Earth Engine."
        columns:
          - name: property_id
            description: "ID único da propriedade (vinculado ao CAR/SIGEF)."
          - name: max_slope
            description: "Declividade máxima encontrada no polígono."

      # --- REGULARIDADE FUNDIÁRIA E AMBIENTAL ---
      
      # Tabelas do SIGEF separadas por UF
      - name: sigef_history_mt
        description: "Histórico de certificações de imóveis rurais no SIGEF - Mato Grosso."
        columns: &hash_control
          - name: file_hash
            description: "Hash MD5 do arquivo original para controle de idempotência."

      - name: sigef_history_am
        description: "Histórico de certificações de imóveis rurais no SIGEF - Amazonas."
        columns: *hash_control

      - name: sigef_history_ro
        description: "Histórico de certificações de imóveis rurais no SIGEF - Rondônia."
        columns: *hash_control

      - name: sigef_history_pa
        description: "Histórico de certificações de imóveis rurais no SIGEF - Pará."
        columns: *hash_control

      # --- TABELAS DO CAR ---
      
      - name: car_area_imovel_geometria_mt
        description: "Geometria espacial (WKT) das propriedades rurais do CAR - Mato Grosso."
        columns: &car_geom_columns
          - <<: *hash_control
          - name: wkt_geom
            description: "Geometria em formato WKT (EPSG:4326)."
          - name: uf_origem
            description: "Sigla do estado injetada durante a ingestão via DuckDB."

      - name: car_area_imovel_geometria_pa
        description: "Geometria espacial (WKT) das propriedades rurais do CAR - Pará."
        columns: *car_geom_columns

      - name: car_area_imovel_geometria_am
        description: "Geometria espacial (WKT) das propriedades rurais do CAR - Amazonas."
        columns: *car_geom_columns

      - name: car_area_imovel_geometria_ro
        description: "Geometria espacial (WKT) das propriedades rurais do CAR - Rondônia."
        columns: *car_geom_columns

      - name: car_metadados_proprietarios
        description: "Metadados de detentores e datas de registro do CAR."

      - name: car_temas_ambientais
        description: "Vetores de APP, Reserva Legal e Uso Consolidado (CSV/Parquet)."

      - name: car_sobreposicao
        description: "Cálculos de sobreposição nativos do SICAR com TIs e UCs."

      # --- RESTRITIVOS SOCIOAMBIENTAIS E BIOMAS (COM FRESHNESS) ---
      - name: ibama_history
        description: "Histórico de áreas embargadas pelo IBAMA."
        # BLINDAGEM DE FRESHNESS: O dbt vai dar erro se a tabela não for atualizada há mais de 7 dias
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 7, period: day}
        loaded_at_field: ingestion_timestamp # Substitua pela coluna de data de ingestão da sua tabela
        columns: *hash_control

      - name: mte_slave_labor_history
        description: "Lista Suja do MTE - Trabalho análogo à escravidão."
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 7, period: day}
        loaded_at_field: ingestion_timestamp # Substitua pela coluna de data de ingestão
        columns:
          - <<: *hash_control
          - name: cnpjcpf
            description: "CPF/CNPJ do infrator para cruzamento de malha."

      - name: ibge_biomes
        description: "Malha digital de biomas brasileiros (Escala 1:250.000)."
        columns:
          - <<: *hash_control
          - name: wkt_geometry
            description: "Geometria convertida para EPSG:4326."

      # --- MONITORAMENTO DE DESMATAMENTO (MAPBIOMAS) ---
      - name: mapbiomas_alertas_shapes
        description: "Polígonos de alertas validados. Fonte da verdade para geometria e data do desmatamento."
        columns:
          - <<: *hash_control
          - name: geometry_wkt
            description: "Geometria do alerta convertida de Shapefile para WKT via DuckDB."
          - name: alertid
            description: "ID único do alerta (Chave Primária)."
            tests:
              - not_null

      - name: mapbiomas_alertas_car_sigef
        description: "Tabela de ligação (Bridge) entre Alertas e Imóveis (CAR/SIGEF)."
        columns:
          - <<: *hash_control
          - name: codsicar
            description: "Código do imóvel no CAR."
          - name: alertid
            description: "ID do alerta correspondente."

      # --- TERRITÓRIOS PROTEGIDOS E HIDROGRAFIA ---
      - name: funai_terras_indigenas  
        description: "Polígonos de Terras Indígenas (FUNAI) em todas as fases."
        columns: *hash_control

      - name: incra_quilombolas
        description: "Territórios Quilombolas delimitados pelo INCRA."
        columns: *hash_control

      - name: ana_app_zones
        description: "Zonas de APP geradas via DuckDB (BHO Nível 07 - Strahler)."
        columns:
          - name: wkt_geom_app
            description: "Polígono da APP (EPSG:4326)."

      - name: ibge_bc250_app_zones
        description: "Zonas de APP de massas d'água (lagos/represas) da BC250."

      - name: raw_ee_app_ndvi
        description: "NDVI cirúrgico das zonas de APP (margens de rios) via GEE."
        columns:
          - name: property_id
            description: "ID único da propriedade (vinculado ao CAR)."
          - name: app_ndvi_mean
            description: "Média do NDVI apenas na área de APP recortada."