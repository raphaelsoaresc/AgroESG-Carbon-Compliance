version: 2

models:
  - name: stg_car_properties
    description: "Propriedades do CAR com áreas originais e ajustadas para transparência forense."
    columns:
      - name: property_id
        data_tests:
          - unique
          - not_null
      - name: area_ha_original
        description: "Valor bruto da área (num_area) como consta na fonte original do governo."
      - name: area_ha_ajustada
        description: "Área tratada para hectares (converte m2 para ha se necessário)."
      - name: is_area_inconsistent
        description: "Flag booleana: TRUE se a área original for <= 0 ou > 1.000.000 ha."
      - name: status_code
        description: "Código do status da propriedade (ind_status no raw)."

  - name: stg_ibama
    description: "Histórico de embargos do IBAMA em MT com limpeza de tax_id e coordenadas."
    columns:
      - name: embargo_id
        data_tests:
          - unique
          - not_null
      - name: tax_id
        description: "CPF/CNPJ do embargado limpo (sem pontuação)."
      - name: embargo_date
        data_tests:
          - not_null
      - name: reported_area_ha
        description: "Área embargada convertida para FLOAT64."
      - name: is_active_embargo
        description: "Flag booleana indicando se o embargo ainda é vigente."

  - name: stg_mapbiomas_alertas
    description: "Alertas de desmatamento validados. Inclui tratamento para alertas sem data original."
    columns:
      - name: alert_id
        description: "ID único do alerta."
        data_tests:
          - unique
          - not_null
      - name: is_undated_alert
        description: "Indica se o MapBiomas omitiu a data de detecção original (DETECTAT)."
      - name: detection_date
        description: "Data da detecção. Alertas sem data são preenchidos com '1900-01-01' para evitar quebra de joins."
        data_tests:
          - not_null
      - name: alert_area_ha
        description: "Área do desmatamento em hectares."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: geometry
        description: "Geometria do polígono (GEOGRAPHY)."
        data_tests:
          - not_null

  - name: stg_mapbiomas_property_crossings
    description: "Tabela de ligação (Bridge) entre Alertas e Imóveis (Opção 4)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - alert_id
            - car_code
    columns:
      - name: alert_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_mapbiomas_alertas')
              field: alert_id
      - name: car_code
        description: "Código do imóvel (CAR) limpo."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_car_properties')
              field: property_id
      - name: overlap_area_ha
        description: "Área de intersecção entre o alerta e o imóvel."
        data_tests:
          - dbt_utils.expression_is_true:
              expression: "> 0"

  - name: stg_mte_slave_labor
    description: "Lista Suja do Trabalho Escravo com normalização de datas e documentos."
    columns:
      - name: tax_id
        description: "CPF/CNPJ do infrator limpo."
        data_tests:
          - not_null
      - name: employer_name
        description: "Nome do empregador em UPPER CASE."
        data_tests:
          - not_null
      - name: inclusion_date
        data_tests:
          - not_null

  - name: stg_sigef
    description: "Certificações fundiárias do SIGEF deduplicadas por imóvel."
    columns:
      - name: property_id
        data_tests:
          - unique
          - not_null
      - name: parcel_id
        description: "ID único da parcela certificada."
        data_tests:
          - unique
          - not_null

  - name: stg_car_owners
    description: "Metadados de inscrição e retificação do CAR vindos da tabela de temas ambientais."
    columns:
      - name: property_id
        data_tests:
          - unique
          - not_null
      - name: registration_status
        description: "Situação do cadastro (Ativo, Pendente, etc)."

  - name: stg_car_overlaps
    description: "Sobreposições nativas do SICAR (TIs, UCs, etc)."
    columns:
      - name: property_id
        description: "ID do CAR."
        data_tests:
          - not_null

  - name: stg_siga_mt__embargos
    description: "Novos polígonos de embargos do sistema SIGA (MT)."
    columns:
      - name: embargo_id
        data_tests:
          - unique
          - not_null
      - name: geometry
        data_tests:
          - not_null

  - name: stg_sema_mt__embargos
    description: "Base histórica de embargos da SEMA (MT)."
    columns:
      - name: embargo_id
        data_tests:
          - unique
          - not_null
      - name: geometry
        data_tests:
          - not_null

  - name: stg_icmbio__embargos
    description: "Infrações e embargos dentro de UCs federais (ICMBio)."
    columns:
      - name: embargo_id
        data_tests:
          - unique
          - not_null
      - name: geometry
        data_tests:
          - not_null

  - name: stg_icmbio__unidades_conservacao
    description: "Limites das UCs Federais (ICMBio)."
    columns:
      - name: uc_id
        data_tests:
          - unique
          - not_null
      - name: geometry
        data_tests:
          - not_null

  - name: stg_sema_mt__unidades_conservacao
    description: "Limites das UCs Estaduais de MT (SEMA)."
    columns:
      - name: uc_id
        data_tests:
          - unique
          - not_null
      - name: geometry
        data_tests:
          - not_null

  - name: stg_incra__assentamentos
    description: "Assentamentos federais (INCRA)."
    columns:
      - name: settlement_id
        data_tests:
          - unique
          - not_null
      - name: geometry
        data_tests:
          - not_null

  - name: stg_intermat__assentamentos
    description: "Assentamentos estaduais de MT (INTERMAT)."
    columns:
      - name: settlement_id
        data_tests:
          - unique
          - not_null
      - name: geometry
        data_tests:
          - not_null

  - name: stg_incra_quilombola_lands
    description: "Territórios quilombolas oficiais (INCRA)."
    columns:
      - name: quilombo_id
        data_tests:
          - unique
          - not_null
      - name: geometry
        data_tests:
          - not_null

  - name: stg_ana__rios_app
    description: "Zonas de APP de rios baseadas na Ordem de Strahler (ANA)."
    columns:
      - name: basin_code
        data_tests:
          - unique
          - not_null
      - name: category
        data_tests:
          - accepted_values:
              values: ['Rio']
      - name: buffer_meters
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 30"
      - name: geometry_wkt
        data_tests:
          - not_null

  - name: stg_ibge__rodovias_risco
    description: "Faixas de domínio e risco em rodovias (IBGE BC250)."
    columns:
      - name: road_id
        data_tests:
          - unique
          - not_null
      - name: category
        data_tests:
          - accepted_values:
              values: ['Rodovia']
      - name: buffer_meters
        data_tests:
          - not_null
      - name: geometry_wkt
        data_tests:
          - not_null

  - name: stg_ibge__massas_agua_app
    description: "Zonas de proteção de lagos e massas d'água (IBGE BC250)."
    columns:
      - name: water_body_id
        data_tests:
          - unique
          - not_null
      - name: category
        data_tests:
          - accepted_values:
              values: ["Massa dagua"]
      - name: buffer_meters
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "= 30"
      - name: geometry_wkt
        data_tests:
          - not_null