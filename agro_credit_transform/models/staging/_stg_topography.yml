version: 2

models:
  - name: stg_property_topography
    description: >
      Dados processados de relevo (SRTM) extraídos via Google Earth Engine. 
      Esta camada padroniza as métricas físicas brutas da propriedade, 
      que permanecem estáticas para análise de conformidade (APPs de declividade).
    columns:
      - name: property_id
        description: "ID único da propriedade (Recibo CAR)."
        data_tests:
          - unique
          - not_null

      - name: max_slope_degrees
        description: "Maior inclinação (declividade) detectada dentro do polígono."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 90

      - name: avg_slope_degrees
        description: "Inclinação média da área total da propriedade."
        data_tests:
          - not_null

      - name: relief_classification
        description: "Classificação do relevo baseada na média (Padrão Embrapa)."
        data_tests:
          - accepted_values:
              values: ['PLANO', 'SUAVE ONDULADO', 'ONDULADO', 'FORTE ONDULADO', 'MONTANHOSO', 'ESCARPADO']

      - name: processed_at
        description: "Timestamp da última extração/processamento dos dados topográficos."
        data_tests:
          - not_null